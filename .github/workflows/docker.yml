name: Docker image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_IMAGE: nousresearch/hermes-agent:v0.22.5
  NODE_VERSION: 24.22.1
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像名必须全小写，而 GitHub 仓库名可能含大写字母。
      - id: image
        name: Resolve lowercase image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=TeamOS
            org.opencontainers.image.description=TeamOS company workspace + Hermes Agent
            org.opencontainers.image.vendor=TeamOS

      - id: build
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_IMAGE=${{ env.HERMES_IMAGE }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Summary
        run: |
          {
            echo "### TeamOS image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pushed: ${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_STEP_SUMMARY"
